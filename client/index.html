    <!-- Moteur audio d'ambiance continu et démarrage automatique -->
    <script>
      (function() {
        var audio = new Audio("/audio/ambient.mp3");
        audio.id = "ambient-audio";
        audio.loop = true;
        audio.volume = 0.85;
        audio.preload = "auto";
        window.__ambientAudio = audio;

        function startAudio() {
          if (!window.__ambientAudio) return;
          var p = window.__ambientAudio.play();
          if (p !== undefined) {
            p.then(function() {
              window.__ambientAudio.muted = false;
              window.__ambientAudio.volume = 0.85;
            }).catch(function() {
              // Si le navigateur bloque le son non muet au chargement à froid :
              // On lance immédiatement la lecture en silencieux puis on réactive le volume au moindre événement
              window.__ambientAudio.muted = true;
              window.__ambientAudio.play().catch(function() {});
            });
          }
        }

        function unmuteAndPlay() {
          if (!window.__ambientAudio) return;
          window.__ambientAudio.muted = false;
          window.__ambientAudio.volume = 0.85;
          if (window.__ambientAudio.paused) {
            window.__ambientAudio.play().catch(function() {});
          }
        }

        // Lancement immédiat à la première milliseconde
        startAudio();

        // Réactivation sonore instantanée au moindre micromouvement
        var triggerEvents = [
          'mousemove', 'pointermove', 'scroll', 'wheel',
          'touchstart', 'touchend', 'touchmove', 'click', 'mousedown',
          'keydown', 'focus', 'mouseenter', 'visibilitychange', 'pageshow'
        ];

        triggerEvents.forEach(function(evt) {
          window.addEventListener(evt, unmuteAndPlay, { passive: true, capture: true });
          document.addEventListener(evt, unmuteAndPlay, { passive: true, capture: true });
        });
      })();
    </script>
