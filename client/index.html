<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preload" href="/audio/ambient.mp3" as="audio" type="audio/mpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var audio = new Audio("/audio/ambient.mp3");
        audio.id = "ambient-audio";
        audio.loop = true;
        audio.volume = 0.85;
        audio.preload = "auto";
        window.__ambientAudio = audio;
        
        function tryPlay() {
          if (window.__ambientAudio && window.__ambientAudio.paused) {
            var p = window.__ambientAudio.play();
            if (p !== undefined) {
              p.catch(function() {});
            }
          }
        }
        
        tryPlay();
        
        var events = ['click', 'touchstart', 'touchend', 'pointerdown', 'scroll', 'keydown', 'mousemove', 'wheel'];
        events.forEach(function(e) {
          window.addEventListener(e, tryPlay, { passive: true, capture: true });
          document.addEventListener(e, tryPlay, { passive: true, capture: true });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
